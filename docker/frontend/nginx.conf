server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    # Built SPA: no Vite HMR; drop unsafe-eval. connect-src same-origin (API proxied under /api/).
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data: blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self';" always;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Laravel API + Sanctum + docs + health
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
        client_max_body_size 20m;
    }

    location /docs/ {
        proxy_pass http://api:8000/docs/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /up {
        proxy_pass http://api:8000/up;
        proxy_set_header Host $host;
    }

    # Mock HTTP routes are not proxied at the edge. Channel/FMIS mocks run in-process
    # inside the API when CHANNEL_ALLOW_MOCK / FMIS_ALLOW_MOCK are enabled.

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
