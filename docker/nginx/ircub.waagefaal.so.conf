# Mount into SSI proxy (ssiwebsite-proxy) alongside the default SSL config, OR
# include from /opt/ssiWebsite/nginx.ssl.conf.
# Requires ircub-web on the same Docker network as the proxy (name: ircub-web).

# HTTP: ACME + redirect (server_name specific so SSI catch-all still works for other hosts)
server {
    listen 80;
    server_name ircub.waagefaal.so;
    client_max_body_size 20m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ircub.waagefaal.so;
    client_max_body_size 20m;

    ssl_certificate /etc/letsencrypt/live/ircub.waagefaal.so/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ircub.waagefaal.so/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/ircub.waagefaal.so/chain.pem;

    location / {
        proxy_pass http://ircub-web:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
        proxy_read_timeout 120s;
    }
}
