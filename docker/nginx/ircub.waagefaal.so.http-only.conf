# Temporary: HTTP only until Let's Encrypt cert exists. Then swap to ircub.waagefaal.so.conf.
server {
    listen 80;
    server_name ircub.waagefaal.so;
    client_max_body_size 20m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        allow all;
    }

    location / {
        # Temporary: serve app over HTTP until cert is ready (then use HTTPS conf).
        proxy_pass http://ircub-web:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
    }
}
